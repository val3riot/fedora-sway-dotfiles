# Foot supports true color; advertise it to applications inside tmux.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',foot*:RGB'
set -g focus-events on
set -s escape-time 10

# Keep the default Ctrl+b prefix and enable mouse selection/scrolling.
set -g mouse on
set -g history-limit 10000
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Open windows and panes in the current pane's working directory.
bind c new-window -c '#{pane_current_path}'
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'

# Copy selections to the Wayland clipboard (requires wl-clipboard).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Colors match Foot's dark palette.
set -g status-style 'bg=#11111b,fg=#cdd6f4'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#45475a,fg=#cdd6f4'
setw -g window-status-current-style 'fg=#89b4fa,bold'
set -g status-left '#[fg=#89b4fa,bold] #S #[default]'
set -g status-right ' %H:%M '
