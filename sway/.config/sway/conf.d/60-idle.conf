exec swayidle -w \
    timeout 1800 '~/Progetti/personali/fedora-sway-dotfiles/scripts/lock.sh' \
    timeout 3600 'swaymsg "output * power off"' \
        resume 'swaymsg "output * power on"' \
    timeout 5400 'systemctl suspend' \
    before-sleep '~/Progetti/personali/fedora-sway-dotfiles/scripts/lock.sh'
